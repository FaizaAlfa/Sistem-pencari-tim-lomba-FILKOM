<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILKOM Team Finder — Platform Pencarian Tim Lomba Mahasiswa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <a href="#" class="brand-title" id="brandLogo">
        <span>FILKOM Team Finder</span>
      </a>

      <nav class="d-none d-md-flex align-items-center gap-2" aria-label="Navigasi Utama">
        <button class="nav-tab-btn active" data-target-screen="screen-dashboard" aria-current="page">
          <span>Cari Kandidat</span>
        </button>
        <button class="nav-tab-btn" data-target-screen="screen-invitations">
          <span>Undangan</span>
          <span class="nav-badge-pill" id="unreadBadgeCount">2</span>
        </button>
        <button class="nav-tab-btn" data-target-screen="screen-team">
          <span>Tim Saya</span>
        </button>
      </nav>

      <div class="d-flex align-items-center gap-3">
        <span class="icon-button notification-indicator" aria-label="Notifikasi" title="Notifikasi">
          <i class="bi bi-bell"></i>
        </span>
        <div class="d-flex align-items-center">
          <div class="user-avatar-btn" title="Rizal — Ketua Tim">R</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container my-4" id="mainContainer"></main>

  <div id="modalContainer"></div>

  <nav class="mobile-bottom-nav" aria-label="Navigasi Bawah Seluler">
    <button class="bottom-nav-item active" data-target-screen="screen-dashboard" aria-current="page">
      <i class="bi bi-search"></i>
      <span>Cari Kandidat</span>
    </button>
    <button class="bottom-nav-item" data-target-screen="screen-invitations">
      <i class="bi bi-envelope"></i>
      <span>Undangan</span>
    </button>
    <button class="bottom-nav-item" data-target-screen="screen-team">
      <i class="bi bi-people"></i>
      <span>Tim Saya</span>
    </button>
  </nav>

  <div id="toastContainer" class="toast-container-custom" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
