<section id="screen-team" class="screen-section d-none" aria-labelledby="teamScreenTitle">
  <div class="mb-4">
    <h1 id="teamScreenTitle" class="h1 fw-bold mb-0">Tim Saya</h1>
  </div>

  <div class="row g-4">
    <aside class="col-12 col-lg-4">
      <div class="team-aside-card">
        <div class="team-badge-pill">Kategori kompetisi: Hackathon</div>
        <h2 class="team-name-title">Tim Nalar</h2>
        <p class="team-desc-text">
          Mengembangkan solusi digital untuk membantu aktivitas mahasiswa di kampus.
        </p>

        <button class="btn-cta-cyan w-100 py-3 mt-4" id="btnViewInvitationsFromTeam">
          <span>Lihat Undangan</span>
        </button>
      </div>
    </aside>

    <section class="col-12 col-lg-8" aria-labelledby="progressTitle">
      <div class="team-progress-card mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 id="progressTitle" class="h3 fw-bold mb-0">Progres Tim</h2>
          <span class="text-secondary fw-medium" id="teamProgressText">1 dari 3 posisi terisi</span>
        </div>

        <div class="team-status-grid mb-3">
          <div class="team-stat-box box-accepted">
            <div class="stat-left">
              <span class="stat-num" id="teamFilledCount">1</span>
              <span class="stat-label">Terisi (Diterima)</span>
            </div>
            <i class="bi bi-check-lg stat-icon"></i>
          </div>

          <div class="team-stat-box box-pending">
            <div class="stat-left">
              <span class="stat-num" id="teamPendingCount">1</span>
              <span class="stat-label">Menunggu</span>
            </div>
            <i class="bi bi-clock stat-icon"></i>
          </div>

          <div class="team-stat-box box-vacant">
            <div class="stat-left">
              <span class="stat-num" id="teamVacantCount">1</span>
              <span class="stat-label">Kosong</span>
            </div>
            <i class="bi bi-dash-circle stat-icon"></i>
          </div>
        </div>

        <div class="progress-bar-custom mb-2" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill-custom" id="teamProgressBarFill" style="width: 33%;"></div>
        </div>

        <p class="progress-note mb-0">
          <span>Menunggu belum dihitung sebagai posisi terisi.</span>
        </p>
      </div>

      <h3 class="h3 fw-bold mb-3">Anggota dan Posisi Tim</h3>
      <div class="positions-container d-flex flex-column gap-3" id="teamSlotsContainer">
      </div>
    </section>
  </div>
</section>
