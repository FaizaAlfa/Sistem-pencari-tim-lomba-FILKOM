<section id="screen-invitations" class="screen-section d-none" aria-labelledby="invitationsScreenTitle">
  <div class="invitations-banner-container mb-4">
    <h1 id="invitationsScreenTitle" class="invitations-banner-title">Undangan</h1>

    <div class="summary-cards-grid mt-3">
      <div class="summary-card status-pending-card">
        <div class="summary-card-inner">
          <div class="summary-stat-group">
            <span class="summary-big-num" id="countPending">2</span>
            <span class="summary-label">Menunggu</span>
          </div>
          <div class="summary-icon-box">
            <i class="bi bi-clock"></i>
          </div>
        </div>
      </div>

      <div class="summary-card status-accepted-card">
        <div class="summary-card-inner">
          <div class="summary-stat-group">
            <span class="summary-big-num" id="countAccepted">1</span>
            <span class="summary-label">Diterima</span>
          </div>
          <div class="summary-icon-box">
            <i class="bi bi-check-lg"></i>
          </div>
        </div>
      </div>

      <div class="summary-card status-rejected-card">
        <div class="summary-card-inner">
          <div class="summary-stat-group">
            <span class="summary-big-num" id="countRejected">1</span>
            <span class="summary-label">Ditolak</span>
          </div>
          <div class="summary-icon-box">
            <i class="bi bi-x-lg"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-update-banner d-none" id="statusUpdateBanner" role="status">
    <div class="status-update-text">
      <i class="bi bi-bell-fill fs-5"></i>
      <span><strong id="statusUpdateCountText">2 pembaruan status</strong> rekrutmen belum ditinjau oleh Anda.</span>
    </div>
    <button class="btn btn-sm btn-outline-dark rounded-pill" id="btnDismissUpdateBanner">
      Tandai Dibaca
    </button>
  </div>

  <div class="status-filter-tabs mb-4" id="invitationStatusTabs" role="tablist" aria-label="Filter Status Undangan"></div>

  <div class="invitation-table-container d-none d-md-block">
    <table class="invitation-table" aria-label="Daftar Undangan Kandidat">
      <thead>
        <tr>
          <th scope="col" style="width: 28%;">Kandidat</th>
          <th scope="col" style="width: 22%;">Peran</th>
          <th scope="col" style="width: 16%;">Dikirim</th>
          <th scope="col" style="width: 16%;">Status</th>
          <th scope="col" style="width: 18%;">Keterangan</th>
        </tr>
      </thead>
      <tbody id="invitationsTableBody">
      </tbody>
    </table>
  </div>

  <div class="mobile-stacked-cards d-block d-md-none" id="invitationsMobileList" aria-label="Daftar Undangan Kandidat Versi Mobile">
  </div>
</section>
