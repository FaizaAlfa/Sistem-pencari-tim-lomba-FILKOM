<section id="screen-profile" class="screen-section d-none" aria-labelledby="profileCandidateName">
  <div class="mb-3">
    <button class="back-nav-btn" id="btnBackToDashboard">
      <i class="bi bi-arrow-left"></i>
      <span>Cari Kandidat</span>
    </button>
  </div>

  <h1 class="h2 d-none d-md-block mb-4 fw-bold">Profil Kandidat</h1>

  <div class="row g-4">
    <aside class="col-12 col-lg-4">
      <div class="profile-card-aside">
        <div class="profile-identity">
          <div class="profile-avatar-large" id="profileAvatar" aria-hidden="true"></div>
          <div>
            <h2 id="profileCandidateName" class="profile-name"></h2>
            <div id="profileSub" class="profile-sub"></div>
          </div>
        </div>

        <p id="profileBio" class="profile-bio-text"></p>

        <div class="profile-section-title">Keahlian</div>
        <div id="profileSkills" class="profile-tag-group mb-3"></div>

        <div class="profile-section-title">Minat Kompetisi</div>
        <div id="profileCategories" class="profile-tag-group mb-4"></div>

        <div class="pt-2">
          <button class="btn-cta-cyan w-100 py-3 fs-6" id="btnOpenInviteModal">
            <span>Undang ke Tim</span>
          </button>
        </div>
      </div>
    </aside>

    <section class="col-12 col-lg-8" aria-labelledby="portfolioSectionTitle">
      <h2 id="portfolioSectionTitle" class="h2 mb-3">Portofolio</h2>
      <div id="portfolioList"></div>
    </section>
  </div>
</section>
